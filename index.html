<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>羽球社分帳計算機</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: #f0f4f8;
    color: #1f2937;
    padding: 16px;
    min-height: 100vh;
  }
  .card {
    max-width: 480px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,.08);
    overflow: hidden;
  }
  header {
    background: linear-gradient(135deg, #16a34a, #059669);
    color: #fff;
    padding: 20px;
    text-align: center;
  }
  header h1 { font-size: 1.3rem; }
  header p { font-size: .85rem; opacity: .9; margin-top: 4px; }
  .body { padding: 20px; }
  label { display: block; font-size: .9rem; font-weight: 600; margin: 14px 0 6px; }
  label:first-child { margin-top: 0; }
  input {
    width: 100%;
    font-size: 1.1rem;
    padding: 10px 12px;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    outline: none;
  }
  input:focus { border-color: #16a34a; }
  .hint { font-size: .78rem; color: #6b7280; margin-top: 4px; }
  .error {
    display: none;
    background: #fef2f2;
    color: #b91c1c;
    border: 1px solid #fecaca;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: .9rem;
    margin-top: 14px;
  }
  .result { display: none; margin-top: 16px; }
  .result.show { display: block; }
  .pay-row { display: flex; gap: 12px; }
  .pay {
    flex: 1;
    border-radius: 12px;
    padding: 14px;
    text-align: center;
  }
  .pay.old { background: #ecfdf5; border: 2px solid #16a34a; }
  .pay.new { background: #eff6ff; border: 2px solid #3b82f6; }
  .pay .tag { font-size: .85rem; font-weight: 600; }
  .pay .amount { font-size: 1.8rem; font-weight: 800; margin: 4px 0; }
  .pay.old .amount { color: #15803d; }
  .pay.new .amount { color: #1d4ed8; }
  .pay .sub { font-size: .78rem; color: #6b7280; }
  .detail {
    margin-top: 12px;
    background: #f9fafb;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: .85rem;
    line-height: 1.8;
  }
  .detail b { float: right; }
  button.copy {
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    font-size: 1rem;
    font-weight: 700;
    color: #fff;
    background: #16a34a;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  button.copy:active { background: #15803d; }
</style>
</head>
<body>
<div class="card">
  <header>
    <h1>🏸 羽球社分帳計算機</h1>
    <p>場地費老社員分，球錢大家一起分，小數無條件進位</p>
  </header>
  <div class="body">
    <label for="court">場地費（元）</label>
    <input id="court" type="number" min="0" value="1600">

    <label for="total">出席人數</label>
    <input id="total" type="number" min="1" step="1" value="10">

    <label for="fresh">其中新人幾位</label>
    <input id="fresh" type="number" min="0" step="1" value="2">
    <div class="hint">新人不用分場地費，只分球錢</div>

    <label for="balls">用掉幾顆球</label>
    <input id="balls" type="number" min="0" step="1" value="6">

    <label for="price">球一顆多少錢（元）</label>
    <input id="price" type="number" min="0" value="50">

    <div class="error" id="error"></div>

    <div class="result" id="result">
      <div class="pay-row">
        <div class="pay old">
          <div class="tag">老社員每人</div>
          <div class="amount">$<span id="oldPay">0</span></div>
          <div class="sub" id="oldCount"></div>
        </div>
        <div class="pay new">
          <div class="tag">新人每人</div>
          <div class="amount">$<span id="newPay">0</span></div>
          <div class="sub" id="newCount"></div>
        </div>
      </div>
      <div class="detail">
        <div>球總額 <b>$<span id="dBallTotal">0</span></b></div>
        <div>實際總成本（場地＋球） <b>$<span id="dActual">0</span></b></div>
        <div>湊整後總收款 <b>$<span id="dCollect">0</span></b></div>
        <div>進位多收 <b>$<span id="dDiff">0</span></b></div>
      </div>
      <button class="copy" id="copyBtn">📋 複製結果貼到群組</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const inputs = ['court', 'total', 'fresh', 'balls', 'price'].map($);

function calc() {
  const court = parseFloat($('court').value);
  const total = parseInt($('total').value, 10);
  const fresh = parseInt($('fresh').value, 10);
  const balls = parseInt($('balls').value, 10);
  const price = parseFloat($('price').value);
  const err = $('error'), res = $('result');

  const fail = msg => {
    err.textContent = msg;
    err.style.display = 'block';
    res.classList.remove('show');
  };

  if ([court, total, fresh, balls, price].some(v => isNaN(v))) return fail('請把 5 個欄位都填上數字。');
  if (court < 0 || price < 0 || balls < 0 || fresh < 0) return fail('金額、人數、球數不可為負數。');
  if (!Number.isInteger(total) || !Number.isInteger(fresh) || !Number.isInteger(balls)) return fail('人數和球數請填整數。');
  if (total <= 0) return fail('出席人數至少要 1 人。');
  if (fresh > total) return fail('新人數不可超過出席人數。');
  const oldCount = total - fresh;
  if (oldCount <= 0) return fail('全部都是新人，場地費沒有人可分。請至少留 1 位老社員。');

  const ballTotal = balls * price;
  const newPay = Math.ceil(ballTotal / total);
  const oldPay = Math.ceil(court / oldCount + ballTotal / total);

  const actual = court + ballTotal;
  const collect = oldPay * oldCount + newPay * fresh;

  $('oldPay').textContent = oldPay;
  $('newPay').textContent = newPay;
  $('oldCount').textContent = `共 ${oldCount} 位`;
  $('newCount').textContent = `共 ${fresh} 位`;
  $('dBallTotal').textContent = ballTotal;
  $('dActual').textContent = actual;
  $('dCollect').textContent = collect;
  $('dDiff').textContent = collect - actual;

  err.style.display = 'none';
  res.classList.add('show');
}

inputs.forEach(el => el.addEventListener('input', calc));
calc();

$('copyBtn').addEventListener('click', async () => {
  const text =
    `🏸 本週收費\n老社員 $${$('oldPay').textContent} x ${$('total').value - $('fresh').value} 位\n` +
    `新人 $${$('newPay').textContent} x ${$('fresh').value} 位\n` +
    `（場地 $${$('court').value}＋球 $${$('dBallTotal').textContent}，進位多收 $${$('dDiff').textContent}）`;
  try {
    await navigator.clipboard.writeText(text);
    $('copyBtn').textContent = '✅ 已複製！';
  } catch {
    prompt('請手動複製：', text);
  }
  setTimeout(() => $('copyBtn').textContent = '📋 複製結果貼到群組', 1500);
});
</script>
</body>
</html>
